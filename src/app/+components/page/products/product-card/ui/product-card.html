<div
  class="block w-full max-w-90 min-w-0 overflow-hidden rounded-[clamp(26px,7vw,40px)] border
   border-[rgb(255,255,255,0.85)] bg-[#ffffff] shadow-[0_12px_26px_rgb(50_35_20/9%)]"
  dir="ltr">

  <div class="aspect-356/383 overflow-hidden bg-[#38271c]">
    <img class="block h-full w-full object-cover" [src]="backend.apiUrl + backend.photoAddress + product.guid"
      [alt]="product.title" width="356" height="383" decoding="async" />
  </div>

  <div class="px-[clamp(20px,6vw,28px)] pb-5.25 pt-[clamp(20px,5vw,25px)]">
    <div class="flex items-center justify-between gap-4 ">
      <p class="text-[clamp(24px,6.5vw,31px)]">
        {{ product.price }}
      </p>
      <p dir="rtl" class="m-0 text-[clamp(24px,6.5vw,31px)] w-full font-normal leading-[1.3] tabular-nums">
        {{ product.title }}
      </p>
    </div>
  </div>

  <!-- فوتر کارت -->
  <div class="mr-5 ml-2 sm:ml-5 mb-5">
    @if (product.badges?.length) {
    <div class="flex items-center justify-between px-0.5 sm:px-2 w-full">
      <div class="flex items-center gap-1 min-[400px]:gap-1.5 sm:gap-2 shrink-0 pb-1">
        @for (badge of product.badges; track $index) {
        <div class="w-10 h-8 sm:w-[4.2rem] sm:h-[4.2rem]
          flex flex-col items-center justify-center shrink-0 text-center leading-none bg-[#70482b] text-[#ffffff]
          rounded-[0.6rem] sm:rounded-[1.25rem] shadow-sm">

          <span class="flex w-full items-center justify-center px-0.5 text-center font-extrabold
                         text-[9px] min-[400px]:text-[10px] sm:text-sm md:text-base leading-tight">
            {{ badge.value }}
          </span>

          @if (badge.type !== 'ratio') {
          <span class="flex w-full items-center justify-center px-0.5 mt-0.5 text-center font-bold
                           text-[7px] min-[400px]:text-[8px] sm:text-[10px] md:text-xs leading-tight">
            {{ badge.label }}
          </span>
          }
        </div>
        }
      </div>

      <div class="w-[1.5px] sm:w-0.5 h-7 sm:h-10 md:h-12 bg-[#ffa76c] mx-1 sm:mx-2 rounded-full shrink-0"></div>

      <div class="flex flex-col items-center justify-center text-[#0a182c] shrink-0">
        <span
          class="text-[15px] min-[400px]:text-lg sm:text-2xl md:text-[2.2rem] leading-none font-black mb-0.5 sm:mb-1">
          {{ product.price}}
        </span>
        <span class="text-[8px] min-[400px]:text-[9px] sm:text-xs md:text-sm font-bold">هزار تومان</span>
      </div>

    </div>
    }
  </div>
</div>
