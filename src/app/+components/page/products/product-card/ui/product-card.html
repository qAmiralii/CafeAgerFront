<div class="group w-full min-w-0 overflow-hidden rounded-[1.7rem]
           border border-white/80 bg-white/90
           shadow-[0_8px_28px_rgb(70_47_30/7%)]
           transition-all duration-500
           hover:-translate-y-1
           hover:shadow-[0_16px_36px_rgb(70_47_30/13%)]" dir="ltr">

  <!-- Product Image -->
  <div class="relative aspect-[4/4.2] overflow-hidden bg-[#38271c]">

    <img class="block h-full w-full object-cover
                   transition-transform duration-700
                   group-hover:scale-[1.045]" [src]="backend.apiUrl + backend.photoAddress + product.guid"
      [alt]="product.title" width="356" height="383" loading="lazy" decoding="async" />

    <!-- Image overlay -->
    <div class="pointer-events-none absolute inset-x-0 bottom-0 h-20 bg-linear-to-t from-black/20 to-transparent">
    </div>

  </div>

  <!-- Product Information -->
  <div class="p-3 sm:p-4 md:p-5">

    <!-- Title and Price -->
    <div class="flex items-center justify-between gap-2 sm:gap-3">

      <div class="min-w-0 flex-1" dir="rtl">
        <p class="m-0 truncate text-sm font-semibold leading-7
                          text-[#4e3526] sm:text-base md:text-lg">
          {{ product.title }}
        </p>
      </div>

      <div class="shrink-0 text-left">

        <p class="m-0 whitespace-nowrap text-base font-extrabold
                          leading-tight tabular-nums text-[#70482b]
                          sm:text-lg md:text-xl">
          {{ product.price }}
        </p>

        <span class="mt-1 block text-[9px] font-medium
                             text-[#a58a75] sm:text-[10px]">
          هزار تومان
        </span>

      </div>

    </div>

    <!-- برچسب های محصولات -->
    @if (product.badges?.length) {

    <div class="my-3 h-px w-full bg-[#eee5dc]"></div>

    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">

      @for (badge of product.badges; track $index) {

      <div class="flex min-h-8 items-center justify-center gap-1
        rounded-full border border-[#ead9c9] bg-[#f8f2eb] px-2.5 py-1
        text-[9px] font-bold text-[#70482b] sm:min-h-9 sm:px-3 sm:text-[11px]">

        <span class="">
          {{ badge.value }}
        </span>

        @if (badge.type !== 'ratio' && badge.label) {
        <span class="font-medium text-[#a58a75]">
          {{ badge.label }}
        </span>
        }

      </div>

      }

    </div>

    }

  </div>

</div>
