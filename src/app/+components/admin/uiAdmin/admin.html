<div lang="fa" class="min-h-screen bg-gray-50 text-gray-800 font-sans" dir="rtl">
    <div class="max-w-screen-lg mx-auto p-4 md:p-6 lg:p-8">

        <header class="flex justify-between items-center mb-6">
            <div class="relative inline-block">
                <button (click)="toggleMenu()" class="p-2 hover:bg-gray-200 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 font-bold text-black" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                @if (isMenuOpen) {
                <div
                    class="absolute top-full mt-2 right-0 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
                    <ul class="flex flex-col">
                        @for (item of menuItems(); track item.title) {
                        <li>
                            <a [routerLink]="item.link"
                                class="block px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-black transition-colors text-right">
                                {{ item.title }}
                            </a>
                        </li>
                        }
                    </ul>
                </div>
                }
            </div>
            <h1 class="text-xl font-bold text-center flex-1"> پنل ادمین</h1>
            <button class="p-2 hover:bg-gray-200 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </button>
        </header>
        <div class="relative mb-8">
            <div class="absolute inset-y-0 right-0 pl-3 flex items-center pr-4 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text"
                class="block w-full pr-12 pl-4 py-3 bg-white border border-gray-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-gray-300 focus:border-transparent transition-all outline-none text-left"
                placeholder="Search..." dir="ltr">
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            @for (category of categories(); track category.guid) {
            <div class="bg-[rgb(64,35,18)] flex flex-col items-center justify-center p-6 rounded-2xl shadow-sm cursor-pointer transform hover:scale-105 transition-transform duration-200"
                (click)="goToProducts(category.guid)">

                <button type="button"
                    class="self-end rounded-lg bg-red-50 px-3 py-1.5 text-xs font-medium text-red-600 transition-colors hover:bg-red-100 hover:text-red-700"
                    (click)="$event.stopPropagation(); deleteModal.showModal()">
                    حذف دسته‌بندی
                </button>

                <dialog #deleteModal
                    class="m-auto w-full max-w-sm rounded-2xl p-0 shadow-xl backdrop:bg-black/50 backdrop:backdrop-blur-sm">
                    <div class="p-6 text-center">
                        <h3 class="mb-5 text-lg font-normal text-gray-800">آیا از حذف این دسته‌بندی اطمینان دارید؟</h3>
                        <div class="flex justify-center gap-3">
                            <button type="button"
                                class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-red-700"
                                (click)="$event.stopPropagation(); removeCategory(category.guid); deleteModal.close()">
                                بله، حذف کن
                            </button>
                            <button type="button"
                                class="rounded-xl border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-900 transition-colors hover:bg-gray-100"
                                (click)="$event.stopPropagation(); deleteModal.close()">
                                انصراف
                            </button>
                        </div>
                    </div>
                </dialog>

                <div class="w-32 h-32 md:w-40 md:h-40 mb-1 flex items-center justify-center">
                    <img [src]="backend.apiUrl+backend.photoAddress+category.guid " [alt]="category.categoryTitle"
                        class="w-full h-full object-contain">
                </div>

                <h2 class="text-base md:text-lg font-bold text-white mb-1 text-center">
                    {{ category.categoryTitle }}
                </h2>

            </div>
            }
        </div>


    </div>
    <app-footer />
</div>
