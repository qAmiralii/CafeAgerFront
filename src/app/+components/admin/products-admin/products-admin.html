<main lang="fa" dir="rtl" class="min-h-screen bg-gray-50/50 px-4 py-6 text-neutral-950 sm:px-8 lg:px-12">
    <div class="mx-auto w-full">
        <header class="mb-6">
            <div class="relative flex min-h-12 items-center justify-between">
                <button type="button" aria-label="افزودن محصول"
                    class="flex h-10 w-12 items-center justify-center rounded-xl bg-[#0A203E] text-2xl font-light text-white shadow-sm transition-colors hover:bg-[#0a203e]/90 focus:outline-none focus:ring-2 focus:ring-[#0A203E] focus:ring-offset-2"
                    (click)="goToAddProduct()">
                    <span aria-hidden="true" class="pb-1">+</span>
                </button>
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
                    <h1 class="whitespace-nowrap text-lg font-bold text-neutral-900 sm:text-xl">
                        {{ selectedCategoryTitle() }}
                    </h1>
                    <p class="mt-1 text-[13px] font-medium text-neutral-500">
                        {{ products().length }} آیتم
                    </p>
                </div>
                <button class="p-2" routerLink="/admin">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
            </div>
            <div class="relative mt-6">
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-neutral-500">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                </div>

                <input id="product-search" type="text" placeholder="...Search" dir="ltr"
                    class="block h-12 w-full rounded-2xl border border-neutral-200 bg-white pl-5 pr-12 text-left text-sm text-neutral-900 shadow-sm outline-none transition-all placeholder:text-neutral-400 focus:border-[#0A203E] focus:ring-1 focus:ring-[#0A203E]" />
            </div>
        </header>
        <section aria-label="فهرست محصولات">
            @if (products().length > 0) {
            <div class="grid w-full grid-cols-1 gap-4">
                @for (product of products(); track product.guid) {
                <div class="w-full">
                    <app-product-card-admin [isBeverage]="isBeverage()" [product]="product" (deleted)="onProductDeleted($event)"
                        (visibilityChange)="onProductVisibilityChange($event)"
                        />
                </div>
                }
            </div>
            } @else {
            <div
                class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-neutral-300 py-16 text-neutral-500">
                <svg class="mb-3 h-10 w-10 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z" />
                </svg>
                <p class="text-sm font-medium">محصولی برای نمایش وجود ندارد.</p>
            </div>
            }
        </section>
    </div>
</main>
