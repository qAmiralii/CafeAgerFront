<div lang="fa" class="min-h-screen flex items-center justify-center bg-[#0A203E] p-4">
<div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-gray-100" dir="rtl">
  
  <!-- بخش هدر: عنوان و دکمه برگشت -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800">افزودن دسته‌بندی جدید</h2>
      <button class="p-2" routerLink="/admin">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
  </div>

  <!-- فرم -->
  <form (ngSubmit)="onSubmit()" class="space-y-6" #categoryForm="ngForm">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-2">نام دسته‌بندی</label>
      <input type="text" id="name" name="name" [(ngModel)]="categoryModel().categoryTitle" required minlength="3"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#0A203E] focus:border-[#0A203E] outline-none transition-colors"
        placeholder="مثلاً: اسپرسو بار">
      
      @if (nameTouched() && categoryModel().categoryTitle.trim().length < 3) { 
        <p class="text-red-500 text-xs mt-1">وارد کردن نام الزامی است و باید حداقل 3 کاراکتر باشد.</p>
      }
    </div>

    <div class="flex items-center justify-between rounded-lg border border-gray-300 bg-gray-50 px-4 py-3">
      <label for="isBeverage" class="text-sm font-medium text-gray-700">این دسته‌بندی نوشیدنی است</label>
      <input type="checkbox" id="isBeverage" name="isBeverage" [(ngModel)]="isBeverage"
        class="h-4 w-4 rounded border-gray-300 text-[#0A203E] focus:ring-[#0A203E]">
    </div>


      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">تصویر دسته‌بندی</label>

        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:bg-gray-50 transition-colors relative">
          <div class="space-y-1 text-center">
            @if (imagePreview()) {
              <img [src]="imagePreview()" alt="پیش‌نمایش" class="mx-auto h-32 w-32 object-cover rounded-lg mb-4">
            } @else {
              <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }

            <div class="flex text-sm text-gray-600 justify-center">
              <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-[#0A203E] hover:text-blue-900 focus-within:outline-none">
                <span>انتخاب فایل</span>
                <input id="file-upload" type="file" class="sr-only" accept="image/*" (change)="onFileSelected($event)">
              </label>
            </div>
            <p class="text-xs text-gray-500">PNG, JPG تا 2 مگابایت</p>
          </div>
        </div>
        @if (imageTouched() && !categoryModel().file) {
          <p class="text-red-500 text-xs mt-1">انتخاب تصویر الزامی است.</p>
        }
      </div>
      <button type="submit"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-[#0A203E] hover:bg-[#07172c] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0A203E] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        ثبت دسته‌بندی
      </button>
    </form>
  </div>
</div>
