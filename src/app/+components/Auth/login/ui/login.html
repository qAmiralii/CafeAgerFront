<!-- لوگو -->
<div class="relative min-h-screen bg-[#1c0f0a] bg-cover bg-center bg-no-repeat flex flex-col items-center justify-center p-4 font-sans overflow-hidden select-none"
    lang="fa" style="background-image: url('/adminPic/bac.png');" dir="rtl">

    <!-- Ambient Liquid Glow Orbs (افکت نور ارگانیک پشت شیشه) -->
    <div
        class="pointer-events-none absolute -top-24 -right-24 w-96 h-96 bg-linear-to-br from-amber-500/25 via-amber-700/15 to-transparent rounded-full blur-3xl animate-pulse">
    </div>
    <div
        class="pointer-events-none absolute -bottom-32 -left-28 w-md h-112 bg-linear-to-tr from-amber-600/20 via-[#4a2615]/30 to-transparent rounded-full blur-3xl">
    </div>
    <div
        class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-amber-400/10 rounded-full blur-2xl">
    </div>

    <!-- Brand / Logo Area -->
    <div class="relative z-10 mb-8 text-center transition-transform duration-300 hover:scale-[1.02]">
        <div
            class="inline-block p-3 rounded-3xl bg-white/3 backdrop-blur-md border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.3)]">
            <img src="/img/logo.png" alt="Vanora Logo" class="w-44 mx-auto drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)]" />
        </div>
    </div>

    <!-- Liquid Glass Card Container -->
    <div
        class="relative z-10 w-full max-w-sm rounded-4xl p-7 sm:p-9 
                bg-linear-to-b from-[#2a170f]/75 via-[#1a0e09]/85 to-[#120805]/90 
                backdrop-blur-2xl backdrop-saturate-150
                border border-amber-500/20 
                shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.2),inset_0_-1px_1px_rgba(0,0,0,0.4)]
                transition-all duration-500 hover:border-amber-400/35 hover:shadow-[0_25px_70px_-15px_rgba(217,119,6,0.15)]">

        <!-- Specular Glass Flare Line -->
        <div class="absolute inset-x-8 top-0 h-px bg-linear-to-r from-transparent via-amber-200/50 to-transparent">
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h2
                class="text-transparent bg-clip-text bg-linear-to-r from-amber-100 via-amber-200 to-amber-400 text-xl sm:text-2xl font-black tracking-wide drop-shadow-sm">
                ورود به پنل مدیریت
            </h2>
            <p class="text-amber-200/50 text-xs mt-1.5 font-medium">خوش‌آمدید، لطفاً مشخصات خود را وارد کنید</p>
        </div>

        <!-- Error Message Glass Alert -->
        @if (errorMessage()) {
        <div
            class="mb-6 p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs sm:text-sm text-center backdrop-blur-md shadow-inner animate-in fade-in zoom-in-95 duration-200">
            {{ errorMessage() }}
        </div>
        }

        <form (ngSubmit)="onSubmit()" class="space-y-4">

            <!-- Username Field -->
            <div
                class="group relative flex items-center rounded-2xl bg-[#0f0704]/60 border border-amber-500/15 backdrop-blur-md transition-all duration-300 focus-within:border-amber-400/60 focus-within:bg-[#0f0704]/90 focus-within:ring-2 focus-within:ring-amber-500/20 focus-within:shadow-[0_0_20px_rgba(245,158,11,0.15)] overflow-hidden">
                <div
                    class="p-3.5 flex items-center justify-center text-amber-300/70 group-focus-within:text-amber-400 group-focus-within:scale-110 transition-all duration-300 w-12 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                </div>
                <input type="text" name="username" [(ngModel)]="loginData.username" placeholder="نام کاربری"
                    class="w-full bg-transparent text-amber-50 px-2 py-3.5 text-sm focus:outline-none placeholder-amber-200/30 font-medium" />
            </div>

            <!-- Password Field -->
            <div
                class="group relative flex items-center rounded-2xl bg-[#0f0704]/60 border border-amber-500/15 backdrop-blur-md transition-all duration-300 focus-within:border-amber-400/60 focus-within:bg-[#0f0704]/90 focus-within:ring-2 focus-within:ring-amber-500/20 focus-within:shadow-[0_0_20px_rgba(245,158,11,0.15)] overflow-hidden">
                <div
                    class="p-3.5 flex items-center justify-center text-amber-300/70 group-focus-within:text-amber-400 group-focus-within:scale-110 transition-all duration-300 w-12 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
                    </svg>
                </div>

                <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password"
                    placeholder="رمز عبور"
                    class="w-full bg-transparent text-amber-50 px-2 py-3.5 text-sm focus:outline-none placeholder-amber-200/30 font-medium" />

                <button type="button" (click)="togglePasswordVisibility()"
                    class="bg-transparent text-amber-300/60 px-3.5 flex items-center justify-center hover:text-amber-200 transition-colors outline-none shrink-0"
                    tabindex="-1">
                    @if (!showPassword) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    }
                    @if (showPassword) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                    }
                </button>
            </div>

            <!-- Forgot Password Link -->
            <div class="text-right pt-1 pb-2">
                <a href="#"
                    class="text-amber-300/70 hover:text-amber-200 text-xs font-medium transition-all duration-200 hover:underline underline-offset-4">
                    فراموشی رمز عبور؟
                </a>
            </div>

            <!-- Primary Liquid Action Button -->
            <button type="submit"
                class="group relative w-full overflow-hidden rounded-2xl p-px focus:outline-none active:scale-[0.98] transition-transform duration-200">
                <div
                    class="absolute inset-0 bg-linear-to-r from-amber-600 via-amber-400 to-amber-700 rounded-2xl transition-all duration-300 group-hover:brightness-110">
                </div>
                <div
                    class="relative flex items-center justify-center py-3.5 px-6 rounded-2xl bg-linear-to-r from-amber-700/80 to-amber-800/90 hover:from-amber-600/90 hover:to-amber-700/95 transition-all text-white font-bold text-sm tracking-wide shadow-[0_10px_25px_-5px_rgba(217,119,6,0.4),inset_0_1px_1px_rgba(255,255,255,0.35)]">
                    ورود به سامانه
                </div>
            </button>

            <!-- Secondary Glass Return Button -->
            <button type="button" routerLink="/home"
                class="w-full py-3.5 px-6 rounded-2xl bg-white/4 hover:bg-white/8 active:scale-[0.98] border border-white/10 hover:border-amber-400/30 text-amber-100/80 hover:text-amber-100 text-sm font-semibold transition-all duration-300 backdrop-blur-md flex items-center justify-center gap-2 shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)]">
                بازگشت به صفحه اصلی
            </button>

        </form>
    </div>

    <!-- Subtle Footer Credential -->
    <div class="relative z-10 mt-8 text-center text-amber-200/30 text-xs tracking-wider">
        <span>Ager Management Security System &copy;</span>
    </div>
</div>
