<!-- COPY -->
 <div class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col items-center justify-center p-4 font-sans"
    lang="fa" style="background-image: url('/adminPic/bac.png');" dir="rtl">
    <div class="mb-10 text-center">
        <img src="/adminPic/logo.png" alt="Vanora Logo" class="w-48 mx-auto drop-shadow-lg" />
    </div>
    <div
        class="w-full max-w-sm bg-[#061124]/80 border border-[#235882] rounded-[1.5rem] p-6 sm:p-8 backdrop-blur-sm shadow-2xl">

        <h2 class="text-white text-center text-lg sm:text-xl font-bold mb-8">ورود به پنل مدیریت</h2>

        @if (errorMessage()) {
        <div class="mb-5 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center">
            {{ errorMessage() }}
        </div>
        }

        <form (ngSubmit)="onSubmit()">

            <div
                class="mb-4 flex border border-[#235882] rounded-xl overflow-hidden focus-within:border-[#007cb7] transition-colors">
                <div class="bg-[#006798] p-3 flex items-center justify-center text-white w-12 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                </div>
                <input type="text" name="username" [(ngModel)]="loginData.username" placeholder="نام کاربری"
                    class="w-full bg-[#061124] text-white px-4 py-2 focus:outline-none placeholder-gray-500" />
            </div>
            <div
                class="mb-2 flex border border-[#235882] rounded-xl overflow-hidden focus-within:border-[#007cb7] transition-colors">
                <div class="bg-[#006798] p-3 flex items-center justify-center text-white w-12 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
                    </svg>
                </div>

                <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password"
                    placeholder="رمز عبور"
                    class="w-full bg-[#061124] text-white px-4 py-2 focus:outline-none placeholder-gray-500" />
                <button type="button" (click)="togglePasswordVisibility()"
                    class="bg-[#061124] text-gray-400 px-3 flex items-center justify-center hover:text-white transition-colors outline-none shrink-0">
                    @if (!showPassword) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    }
                    @if (showPassword) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                    }
                </button>
            </div>
            <div class="text-right mb-8">
                <a href="#" class="text-white text-xs sm:text-sm hover:text-[#007cb7] transition-colors">فراموشی رمز
                    عبور</a>
            </div>
            <button type="submit"
                class="w-full bg-[#006798] text-white font-bold py-3 rounded-xl hover:bg-[#00547d] active:scale-[0.98] transition-all">
                ورود
            </button>
            <button type="button" routerLink="/home"
                class="w-full mt-3 bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                برگشت
            </button>

        </form>
    </div>
</div>
